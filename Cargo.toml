[package]
name = "skills-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Declarative, commit-pinned skills with managed symlinks and patches"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
walkdir = "2"
